services:
  ccna-netsim:
    image: networksimulator-ccna-netsim:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ccna-network-simulator
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
